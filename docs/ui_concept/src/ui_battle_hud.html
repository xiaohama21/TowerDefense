<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ui_battle_hud</title>
<style>
/* ===== 局内顶栏概念稿（草稿 v0.3）：Kenney 亮蓝 + 快乐体，深海军蓝战场顶栏 ===== */
@font-face { font-family:"ZCOOL-Kuaile"; src:url("fonts/ZCOOL-Kuaile.ttf") format("truetype"); }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1280px; height:720px; overflow:hidden; }
body { font-family:"ZCOOL-Kuaile",sans-serif; background:#214230; }

/* ---------- 战场底（s01 风格示意：16×9 网格 / 横向主路 / 少量装饰） ---------- */
.field { position:absolute; inset:0; overflow:hidden;
  background-color:#214230;
  background-image:
    conic-gradient(#1d3a2a 25%, #214230 0 50%, #1d3a2a 0 75%, #214230 0);
  background-size:160px 160px; }
.gridline { position:absolute; inset:0; pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
                   linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
  background-size:80px 80px; }
.road { position:absolute; left:0; top:240px; width:1200px; height:80px;
  background:#78573d; border-top:4px solid #261f19; border-bottom:4px solid #261f19; }
.road .shine { position:absolute; left:0; top:8px; width:100%; height:10px;
  background:rgba(255,235,205,.10); }
.road-drop { position:absolute; left:1200px; top:240px; width:80px; height:160px;
  background:#78573d; border:4px solid #261f19; border-left:0; }
.chevron { position:absolute; top:252px; width:0; height:0;
  border-top:14px solid transparent; border-bottom:14px solid transparent;
  border-left:22px solid rgba(235,205,150,.55); }
.gate { position:absolute; left:10px; top:248px; width:64px; height:64px; border-radius:10px;
  background:rgba(199,158,92,.22); border:3px solid #c79e5c; color:#e8c98a;
  font-size:30px; line-height:58px; text-align:center; }
.base { position:absolute; left:1206px; top:326px; width:68px; height:68px; border-radius:12px;
  background:#ad4a3d; border:3px solid #d9bf73; box-shadow:0 4px 10px rgba(0,0,0,.35); }
.base .door { position:absolute; left:50%; bottom:5px; transform:translateX(-50%);
  width:22px; height:30px; background:#261f19; border-radius:6px 6px 0 0; }
.base .roof { position:absolute; left:-6px; top:-10px; width:calc(100% + 12px); height:14px;
  background:#7e3129; border-radius:8px 8px 0 0; border:2px solid #d9bf73; }
.flag { position:absolute; left:1256px; top:296px; width:3px; height:34px; background:#c9a35c; }
.flag i { position:absolute; left:3px; top:-2px; width:18px; height:12px;
  background:#e05a4e; border-radius:0 6px 6px 0; }
.tree { position:absolute; width:0; height:0; }
.tree .trunk { position:absolute; left:-5px; top:22px; width:10px; height:16px;
  background:#4d3824; border-radius:2px; }
.tree .leaf { position:absolute; left:-24px; top:-10px; width:48px; height:44px;
  background:radial-gradient(circle at 34% 28%, #3f7d52, #2f613f 70%);
  border:3px solid #235038; border-radius:50% 50% 46% 54%; }
.mtn { position:absolute; width:0; height:0; }
.mtn .a { position:absolute; width:52px; height:42px; background:#544f45;
  clip-path:polygon(50% 6%, 100% 100%, 0 100%); }
.mtn .b { position:absolute; width:26px; height:18px; left:8px; top:2px; background:#576b57;
  clip-path:polygon(50% 0, 100% 100%, 0 100%); }
.mtn2 { position:absolute; width:0; height:0; }
.mtn2 .a { position:absolute; width:44px; height:36px; background:#544f45;
  clip-path:polygon(50% 8%, 100% 100%, 0 100%); }
.mtn2 .b { position:absolute; width:20px; height:14px; left:8px; top:2px; background:#576b57;
  clip-path:polygon(50% 0, 100% 100%, 0 100%); }
.enemy { position:absolute; width:18px; height:18px; border-radius:50%;
  background:radial-gradient(circle at 36% 30%, #ffe08a, #e7b84f 70%);
  border:2px solid #9c6f2b; box-shadow:0 2px 4px rgba(0,0,0,.35); }

/* ---------- 顶栏 ---------- */
.bar { position:absolute; left:16px; top:14px; width:1248px; height:80px;
  display:flex; align-items:center; gap:8px; padding:0 12px;
  background:linear-gradient(180deg, rgba(24,34,54,.97), rgba(13,18,31,.97));
  border:2px solid #406ead; border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.10); }
.stage { font-size:16px; color:#c9e9d2; letter-spacing:0; white-space:nowrap; }
.rule { width:1px; height:36px; background:rgba(255,255,255,.16); }
.pill { display:flex; align-items:center; gap:9px; height:52px; padding:0 9px 0 6px;
  background:#fff; border:2px solid #7fb2d9; border-radius:14px;
  box-shadow:0 2px 6px rgba(0,0,0,.3); }
.well { width:38px; height:38px; flex:none; border-radius:10px; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(180deg,#ffffff,#f0f6fb); border:1px solid #d7e6f2; }
.well img { width:100%; height:100%; object-fit:contain; }
.well.ghost { border:2px dashed #9cbed9; background:rgba(232,242,250,.55); }
.well.ghost svg { width:22px; height:22px; }
.pill .v { font-size:24px; letter-spacing:.5px; white-space:nowrap; }
.v-gold { color:#b07a00; }
.v-hp   { color:#0e9f58; }
.v-wave { color:#14538a; }
.spacer { flex:1; }
.bken { border:0; font-family:"ZCOOL-Kuaile",sans-serif; cursor:default;
  border-image-slice:24 fill; border-image-width:24px; border-image-repeat:round;
  display:flex; align-items:center; justify-content:center; white-space:nowrap; }
.b-start { height:48px; width:178px; font-size:20px; letter-spacing:2px; color:#22384a;
  border-image-source:url("kenney_ui_pack/PNG/Yellow/Double/button_rectangle_gloss.png"); }
.b-supply { height:48px; width:126px; font-size:19px; letter-spacing:1px; color:#fff; gap:8px;
  border-image-source:url("kenney_ui_pack/PNG/Blue/Double/button_rectangle_depth_flat.png"); }
.supply-ico { width:26px; height:26px; flex:none; border-radius:50%;
  border:2px dashed rgba(255,255,255,.9); display:flex; align-items:center; justify-content:center; }
.supply-ico svg { width:15px; height:15px; opacity:.95; }
.b-ghost { height:42px; width:74px; font-size:16px; letter-spacing:1px; color:#33566f;
  border-image-source:url("kenney_ui_pack/PNG/Grey/Double/button_rectangle_depth_flat.png"); }
.b-exit { height:42px; width:84px; font-size:16px; letter-spacing:1px; color:#fff;
  border-image-source:url("kenney_ui_pack/PNG/Red/Double/button_rectangle_depth_flat.png"); }
.legend { position:absolute; left:24px; top:106px; display:flex; flex-direction:column; gap:7px;
  font-size:13px; color:#cfe3f2; background:rgba(10,16,26,.58); border:1px dashed rgba(180,210,235,.6);
  border-radius:10px; padding:8px 12px; letter-spacing:1px; }
.lrow { display:flex; align-items:center; gap:9px; }
.mpill { display:flex; align-items:center; gap:6px; background:#fff; border:1.5px solid #8fc2e2;
  border-radius:9px; padding:2px 9px 2px 3px; height:27px; }
.mpill img { width:19px; height:19px; object-fit:contain; }
.mpill .v { font-size:14px; }
.mcap { color:#bcd8ea; white-space:nowrap; }

/* ---------- 底部人物详情（虚线半透明草图） ---------- */
.dpanel { position:absolute; left:420px; bottom:14px; width:460px; padding:10px 12px 11px;
  background:rgba(12,18,30,.62); border:2px dashed rgba(160,205,240,.8); border-radius:16px;
  display:flex; flex-direction:column; gap:8px;
  box-shadow:0 8px 22px rgba(0,0,0,.35); }
.dp-head { display:flex; align-items:center; gap:10px; }
.dp-ava { width:42px; height:42px; flex:none; border-radius:50%;
  background:radial-gradient(circle at 32% 28%, #ff9d7d, #e85b43 78%);
  border:2px solid rgba(255,255,255,.85); color:#fff; font-size:20px;
  display:flex; align-items:center; justify-content:center;
  text-shadow:0 1px 2px rgba(90,20,10,.5); }
.dp-who { display:flex; flex-direction:column; gap:2px; min-width:0; }
.dp-name { font-size:18px; color:#fff; letter-spacing:1px; white-space:nowrap; }
.dp-sub { font-size:11px; color:#9fc0d8; letter-spacing:1px; white-space:nowrap; }
.dp-tag { margin-left:auto; flex:none; font-size:12px; color:#4a3700; background:#ffd34d;
  border-radius:9px; padding:2px 10px; letter-spacing:1px; white-space:nowrap; }
.dp-stats { display:flex; gap:8px; }
.dp-stat { flex:1; background:rgba(255,255,255,.055); border:1px dashed rgba(190,225,250,.4);
  border-radius:10px; padding:4px 6px 5px; text-align:center; }
.dp-stat .k { font-size:11px; color:#9fc0d8; letter-spacing:1px; }
.dp-stat .b { font-size:16px; color:#7ec8ea; letter-spacing:.5px; }
.dp-btns { display:flex; gap:8px; }
.b-act { height:36px; flex:1; min-width:0; }

/* ---------- 选中塔 ---------- */
.tsel { position:absolute; width:50px; height:52px; }
.tsel .ring { position:absolute; left:-27px; top:-24px; width:90px; height:90px;
  border:2px solid rgba(255,206,92,.95); border-radius:50%;
  box-shadow:0 0 0 5px rgba(255,206,92,.14); }
.tsel .body { position:absolute; left:6px; top:7px; width:38px; height:38px; border-radius:50%;
  background:radial-gradient(circle at 32% 28%, #ff9d7d, #e85b43 78%);
  border:2px solid rgba(255,255,255,.9); color:#fff; font-size:19px;
  display:flex; align-items:center; justify-content:center; text-shadow:0 1px 2px rgba(90,20,10,.5); }
.tsel .tname { position:absolute; left:2px; top:44px; width:56px; text-align:center;
  font-size:12px; color:#ffe9b0; letter-spacing:1px; white-space:nowrap;
  text-shadow:0 1px 3px #000,0 0 6px rgba(0,0,0,.8); }
</style>
</head>
<body>
<div class="field">
  <!-- 主路（s01 示意）：第 4 行横向 + 末端下行到基地 -->
  <div class="road"><div class="shine"></div></div>
  <div class="road-drop"></div>
  <div class="gate">▶</div>
  <div class="base"><div class="roof"></div><div class="door"></div></div>
  <div class="flag"><i></i></div>
  <!-- 道路行进箭头 -->
  <div class="chevron" style="left:340px"></div>
  <div class="chevron" style="left:520px; opacity:.8"></div>
  <div class="chevron" style="left:700px"></div>
  <div class="chevron" style="left:880px; opacity:.8"></div>
  <!-- 敌人（黄巾小兵） -->
  <div class="enemy" style="left:430px; top:279px"></div>
  <div class="enemy" style="left:600px; top:278px"></div>
  <div class="enemy" style="left:770px; top:280px"></div>
  <div class="enemy" style="left:950px; top:279px"></div>
  <div class="enemy" style="left:1100px; top:280px"></div>
  <!-- 装饰树 -->
  <div class="tree" style="left:176px; top:184px"><div class="leaf"></div><div class="trunk"></div></div>
  <div class="tree" style="left:976px; top:176px"><div class="leaf"></div><div class="trunk"></div></div>
  <div class="tree" style="left:256px; top:472px"><div class="leaf"></div><div class="trunk"></div></div>
  <div class="tree" style="left:1064px; top:472px"><div class="leaf"></div><div class="trunk"></div></div>
  <!-- 禁建山 -->
  <div class="mtn" style="left:974px; top:566px"><div class="a"></div><div class="b"></div></div>
  <div class="mtn2" style="left:1056px; top:578px"><div class="a"></div><div class="b"></div></div>
  <div class="mtn" style="left:1136px; top:566px; opacity:.92"><div class="a"></div><div class="b"></div></div>
  <!-- 选中塔（张飞 · 阶 2） -->
  <div class="tsel" style="left:735px; top:406px">
    <div class="ring"></div>
    <div class="body">张</div>
    <div class="tname">张飞 · 阶 2</div>
  </div>
  <div class="gridline"></div>
</div><!-- ===== 局内顶栏 ===== -->
<div class="bar">
  <div class="stage">桃园起兵 · 涿郡</div>
  <div class="rule"></div>

  <div class="pill" title="金币">
    <div class="well"><img src="icons_battle/coin_crop.png" alt="金币"></div>
    <div class="v v-gold">100</div>
  </div>

  <div class="pill" title="基地生命">
    <div class="well"><img src="icons_battle/base_hp_crop.png" alt="基地生命"></div>
    <div class="v v-hp">20</div>
  </div>

  <div class="pill" title="波次">
    <div class="well ghost"><svg viewBox="0 0 24 24" fill="none" stroke="#7fa3c2" stroke-width="2.2" stroke-linecap="round">
      <path d="M2 8c2.5-2.6 5-2.6 7.5 0s5 2.6 7.5 0 4-2.2 5-1.4"/><path d="M2 14c2.5-2.6 5-2.6 7.5 0s5 2.6 7.5 0 4-2.2 5-1.4"/></svg></div>
    <div class="v v-wave">3 / 8</div>
  </div>

  <div class="spacer"></div>

  <div class="bken b-start">开始第 3 波</div>
  <div class="bken b-supply"><span class="supply-ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 9.5h11l-1 9a2.2 2.2 0 0 1-2.2 2H9.7a2.2 2.2 0 0 1-2.2-2z"/><path d="M8.5 9.5V7a3.5 3.5 0 0 1 7 0v2.5"/></svg></span>军需</div>
  <div class="bken b-ghost">暂停</div>
  <div class="bken b-ghost">设置</div>
  <div class="bken b-ghost">重开</div>
  <div class="bken b-exit">退出</div>
</div>

<!-- ===== 底部人物详情（虚线半透明草图） ===== -->
<div class="dpanel">
  <div class="dp-head">
    <div class="dp-ava">张</div>
    <div class="dp-who">
      <div class="dp-name">张飞 · 虎贲</div>
      <div class="dp-sub">职业技能：军旗　·　角色技：当阳桥</div>
    </div>
    <div class="dp-tag">局内阶数 2 / 3</div>
  </div>
  <div class="dp-stats">
    <div class="dp-stat"><span class="k">伤害</span><br><span class="b">45</span></div>
    <div class="dp-stat"><span class="k">攻速（次/秒）</span><br><span class="b">1.20</span></div>
    <div class="dp-stat"><span class="k">射程</span><br><span class="b">140</span></div>
  </div>
  <div class="dp-btns">
    <div class="bken b-act" style="border-image-source:url('kenney_ui_pack/PNG/Yellow/Double/button_rectangle_depth_flat.png'); color:#4a3700; font-size:14px; letter-spacing:0;">升阶（36 金币）</div>
    <div class="bken b-act" style="border-image-source:url('kenney_ui_pack/PNG/Grey/Double/button_rectangle_depth_flat.png'); color:#33566f; font-size:14px; letter-spacing:0;">回收（返还 120）</div>
  </div>
</div>

<div class="legend">
  <div class="lrow">
    <span class="mpill"><img src="icons_battle/base_hp_crop.png" alt=""><span class="v v-hp">20</span></span>
    <span class="mcap">安全（＞30%）</span>
    <span class="mpill"><img src="icons_battle/base_hp_crop.png" alt=""><span class="v" style="color:#e5484d">5</span></span>
    <span class="mcap">危急（≤30%）红闪</span>
  </div>
  <div class="lrow">虚线圆 = 波次 / 军需图标占位（待美术补充）</div>
</div>

<script>
window.addEventListener('load',function(){
  var bad=[];
  document.querySelectorAll('.bar *,.bar').forEach(function(el){
    if(el.scrollWidth>el.clientWidth+1){ bad.push((el.className.baseVal!==undefined?el.className.baseVal:el.className)+'@'+el.scrollWidth+'/'+el.clientWidth); }
  });
  document.title = bad.length? 'OVERFLOW '+bad.slice(0,10).join(','): 'OK';
});
</script>
</body>
</html>
