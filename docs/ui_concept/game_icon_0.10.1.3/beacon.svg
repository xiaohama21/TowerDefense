<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 96 96"><defs>
<linearGradient id="bv-jade" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#8cb08b"/><stop offset=".48" stop-color="#4b8064"/><stop offset="1" stop-color="#254d3c"/></linearGradient>
<linearGradient id="bv-rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8d49c"/><stop offset=".46" stop-color="#a7b584"/><stop offset="1" stop-color="#3f6850"/></linearGradient>
<linearGradient id="bv-wall" x1="0" y1="0" x2=".25" y2="1"><stop stop-color="#fff0b2"/><stop offset=".46" stop-color="#e5b86a"/><stop offset="1" stop-color="#ba823f"/></linearGradient>
<linearGradient id="bv-stone-side" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#bd914c"/><stop offset="1" stop-color="#80582d"/></linearGradient>
<linearGradient id="bv-eaves" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#557c56"/><stop offset=".56" stop-color="#315c43"/><stop offset="1" stop-color="#203f32"/></linearGradient>
<linearGradient id="bv-gold-edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2b8"/><stop offset=".52" stop-color="#efc574"/><stop offset="1" stop-color="#b88844"/></linearGradient>
<linearGradient id="bv-fire" x1="0" y1="0" x2=".25" y2="1"><stop stop-color="#ffb05f"/><stop offset=".42" stop-color="#ed7d43"/><stop offset="1" stop-color="#b2492e"/></linearGradient>
<linearGradient id="bv-fire-core" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff3be"/><stop offset=".55" stop-color="#ffd46c"/><stop offset="1" stop-color="#ecaa46"/></linearGradient>
<linearGradient id="bv-banner" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#d88655"/><stop offset=".48" stop-color="#b85c3d"/><stop offset="1" stop-color="#863d2b"/></linearGradient>
<linearGradient id="bv-door" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#173e32"/><stop offset="1" stop-color="#37674a"/></linearGradient>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
<!-- One enclosing rim; the jade plane carries the lighting itself. -->
<rect x="3" y="3" width="90" height="90" rx="19" fill="url(#bv-jade)" stroke="url(#bv-rim)" stroke-width="2.2"/>
<!-- A single plain field standard identifies a fortified military camp. -->
<path d="M76 20V73" fill="none" stroke="#254533" stroke-width="2.4"/>
<path d="M75.4 20V72" fill="none" stroke="#edcd82" stroke-width="1.3"/>
<path d="M73.5 19L76 14L78.5 19L76 21Z" fill="url(#bv-gold-edge)" stroke="#72512a" stroke-width=".9"/>
<path d="M76.2 22Q82 20 88 23V37Q82 34 76.2 37Z" fill="url(#bv-banner)" stroke="#70402d" stroke-width="1"/>
<path d="M77 23Q82 21.5 87 23.5M77 35Q82 33.5 87 36" fill="none" stroke="#edba73" stroke-width="1.1"/>
<!-- The tower widens toward a substantial masonry plinth. -->
<path d="M29 50H69L76 84H22Z" fill="#163d2c" opacity=".34" transform="translate(2,2)"/>
<path d="M30 49H64L72 81H23Z" fill="url(#bv-wall)" stroke="#77542e" stroke-width="1.5"/>
<path d="M64 49L69 53L76 79L72 81Z" fill="url(#bv-stone-side)" stroke="#6f4e2b" stroke-width="1.1"/>
<path d="M31 52L25 78M33 58H61" fill="none" stroke="#fff0b0" stroke-width="1.3"/>
<path d="M29 68H36M60 68H68" fill="none" stroke="#ad7b3c" stroke-width="1.4" opacity=".7"/>
<!-- Broad upturned eaves establish the Chinese watchtower silhouette. -->
<path d="M12 40Q17 45 23 43L38 37H58L73 43Q80 45 85 39L80 49Q48 55 17 49Z" fill="url(#bv-eaves)" stroke="#244632" stroke-width="1.6"/>
<path d="M17 47Q48 52 80 47L79 51Q48 56 18 51Z" fill="url(#bv-gold-edge)" stroke="#76592f" stroke-width="1"/>
<path d="M23 43L39 39H57L73 43" fill="none" stroke="#8ca57a" stroke-width="1.2"/>
<!-- The flame stands in a dark copper basin, not in the building itself. -->
<path d="M42 36V43M55 36V43" fill="none" stroke="#6f4b2c" stroke-width="2.2"/>
<path d="M42 42H56" fill="none" stroke="#e3b968" stroke-width="1.3"/>
<path d="M35 31H62L59 37Q48 42 38 37Z" fill="#805032" stroke="#553c29" stroke-width="1.2"/>
<path d="M36 31H62V33H36Z" fill="#d4a85f" stroke="#573e28" stroke-width="1"/>
<path d="M40 35Q48 38 56 35" fill="none" stroke="#c38b49" stroke-width="1.2"/>
<!-- A wind-leaning beacon: one orange outline, one broad gold core. -->
<path d="M40 31C33 27 37 21 42 16C47 12 48 8 48 5C57 10 59 16 57 21C61 20 64 16 64 13C71 22 67 28 61 31C55 35 46 35 40 31Z" fill="url(#bv-fire)" stroke="#8f422a" stroke-width="1.5"/>
<path d="M44 30C40 27 42 24 47 20C50 17 51 14 50 12C57 18 57 23 54 26C58 26 59 24 60 22C62 28 58 32 53 33C49 33 46 32 44 30Z" fill="url(#bv-fire-core)"/>
<path d="M46 28C46 25 49 23 51 22C51 25 55 26 55 29C54 32 50 33 47 31Z" fill="#fff1b4"/>
<path d="M41 21L46 16M50 9Q55 12 55 16" fill="none" stroke="#ffd78d" stroke-width="1.2"/>
<!-- The deep open gateway gives a clear negative-space anchor at 16px. -->
<path d="M36 81V67C36 51 60 51 60 67V81Z" fill="#98672f"/>
<path d="M39 81V67C39 55 57 55 57 67V81Z" fill="url(#bv-door)"/>
<path d="M37 79V66C37 53 59 53 59 66V79" fill="none" stroke="#ffe5a0" stroke-width="1.8"/>
<path d="M42 81L48 76L55 81Z" fill="#9dac73" opacity=".32"/>
<path d="M20 80H76V84L72 87H24L20 84Z" fill="url(#bv-stone-side)" stroke="#6a4c2b" stroke-width="1.1"/>
<path d="M21 81H75M25 85H71" fill="none" stroke="url(#bv-gold-edge)" stroke-width="1.5"/>
</g></svg>