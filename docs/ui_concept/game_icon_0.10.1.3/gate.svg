<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 96 96"><defs>
<linearGradient id="gc-jade" x1="0" y1="0" x2=".75" y2="1"><stop stop-color="#84a58c"/><stop offset=".48" stop-color="#537d65"/><stop offset="1" stop-color="#294f3e"/></linearGradient>
<linearGradient id="gc-gold" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#ffe4a2"/><stop offset=".48" stop-color="#e7bd70"/><stop offset="1" stop-color="#ae7939"/></linearGradient>
<linearGradient id="gc-side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c5944e"/><stop offset="1" stop-color="#805326"/></linearGradient>
<linearGradient id="gc-roof" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#5d8973"/><stop offset=".5" stop-color="#3d6a57"/><stop offset="1" stop-color="#244d3d"/></linearGradient>
<linearGradient id="gc-fire" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#ffc075"/><stop offset=".4" stop-color="#e88149"/><stop offset="1" stop-color="#ad422b"/></linearGradient>
<linearGradient id="gc-core" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff4bd"/><stop offset="1" stop-color="#f7c461"/></linearGradient>
<linearGradient id="gc-flag" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#d47950"/><stop offset="1" stop-color="#954331"/></linearGradient>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
<!-- One jade tile edge; a single military standard sits behind the roofline. -->
<rect x="3" y="3" width="90" height="90" rx="19" fill="url(#gc-jade)" stroke="#b4c19a" stroke-width="1.7"/>
<path d="M22 20V55" fill="none" stroke="#243f31" stroke-width="2.5"/>
<path d="M23 21Q32 17 39 22L37 32Q30 28 23 32Z" fill="url(#gc-flag)" stroke="#743d2c" stroke-width="1"/>
<path d="M24 22Q31 20 37 23" fill="none" stroke="#e5ad71" stroke-width="1"/>
<path d="M22 16L24 19L22 22L20 19Z" fill="#e9c779"/>
<!-- Compact wall shadows are solid geometry, keeping the small icon crisp. -->
<path d="M15 52H82V82L78 87H18L13 84Z" fill="#173c2c" opacity=".36" transform="translate(2,2)"/>
<!-- Side watchtowers and the larger gate front are unmistakably a walled camp. -->
<path d="M16 51H35V82H16Z" fill="url(#gc-gold)" stroke="#6c4d2d" stroke-width="1.1"/>
<path d="M65 51H83V82H65Z" fill="url(#gc-gold)" stroke="#6c4d2d" stroke-width="1.1"/>
<path d="M78 51L83 48V78L78 82Z" fill="url(#gc-side)"/>
<path d="M34 50H66V84H34Z" fill="url(#gc-gold)" stroke="#6c4d2d" stroke-width="1.2"/>
<path d="M22 61H28V68H22ZM70 61H76V68H70Z" fill="#3a523a"/>
<path d="M18 53V78M36 54V78M67 54V78" fill="none" stroke="#ffe7af" stroke-width="1.1"/>
<!-- Broad dark arches and sparse masonry; details never compete with the beacon. -->
<path d="M39 84V68C39 51 61 51 61 68V84Z" fill="url(#gc-side)"/>
<path d="M42 84V67C42 56 58 56 58 67V84Z" fill="#244c39"/>
<path d="M40 81V67C40 53 60 53 60 67" fill="none" stroke="#ffe6a6" stroke-width="1.6"/>
<path d="M43 83L49 78L57 83Z" fill="#638961" opacity=".55"/>
<path d="M18 74H29M70 74H77" fill="none" stroke="#a27437" stroke-width="1" opacity=".5"/>
<!-- Han-style roofs: strong single silhouettes with raised eaves, restrained tile ribs. -->
<path d="M12 49Q17 49 21 41H32Q35 47 40 49L36 53H16Z" fill="#79552c" stroke="#294c38" stroke-width="1"/>
<path d="M11 46Q16 47 21 39H31Q35 45 41 46L36 50H16Z" fill="url(#gc-roof)" stroke="#203f31" stroke-width="1.3"/>
<path d="M13 47Q23 48 39 47" fill="none" stroke="#96ab77" stroke-width="1.1"/>
<path d="M60 49Q65 49 70 41H79Q82 47 87 49L83 53H64Z" fill="#79552c" stroke="#294c38" stroke-width="1"/>
<path d="M59 46Q65 47 70 39H79Q83 45 88 46L83 50H64Z" fill="url(#gc-roof)" stroke="#203f31" stroke-width="1.3"/>
<path d="M62 47Q71 48 86 47" fill="none" stroke="#96ab77" stroke-width="1.1"/>
<path d="M29 49Q35 48 39 42H61Q65 48 72 49L66 55H35Z" fill="#916334" stroke="#594327" stroke-width="1.1"/>
<path d="M27 46Q33 47 39 40H61Q67 47 74 46L68 51H34Z" fill="url(#gc-roof)" stroke="#203f31" stroke-width="1.4"/>
<path d="M30 48Q50 50 71 48" fill="none" stroke="#afba85" stroke-width="1.2"/>
<path d="M39 42H62" fill="none" stroke="#73937a" stroke-width="1"/>
<!-- An isolated fire bowl identifies a signal beacon rather than a burning building. -->
<path d="M42 35H59L57 42H44Z" fill="#8d602d" stroke="#3d3d28" stroke-width="1.1"/>
<path d="M40 35H61V38H40Z" fill="#433d27" stroke="#282f22" stroke-width="1"/>
<path d="M43 35C33 30 38 23 44 18C49 14 50 11 50 7C60 14 63 22 60 25C65 23 66 20 66 17C73 27 67 34 60 36C55 39 46 38 43 35Z" fill="url(#gc-fire)" stroke="#843d29" stroke-width="1.3"/>
<path d="M47 34C42 29 47 24 51 20C54 17 54 16 54 14C61 21 60 26 57 28C61 28 62 25 63 23C66 31 58 36 53 36C50 36 48 35 47 34Z" fill="url(#gc-core)"/>
<path d="M48 31C46 28 51 25 53 23C54 28 57 28 57 31C57 35 50 36 48 31Z" fill="#fff5cb"/>
<!-- A single stepped foundation grounds the silhouette. -->
<path d="M14 81H84V85L78 88H20L14 85Z" fill="url(#gc-side)" stroke="#6b4b2b" stroke-width="1"/>
<path d="M16 82H82M21 85H78" fill="none" stroke="#e5bd72" stroke-width="1.2"/>
</g></svg>